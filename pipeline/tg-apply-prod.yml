---
trigger:
  branches:
    include:
    - 'main'
  paths:
    include:
    - environments/prod

pr: none

pool: 'CMRC Prod Pool'

jobs:
  - job: Manual_Validation
    pool: server
    timeoutInMinutes: 90
    steps:
      - task: ManualValidation@1
        displayName: Request Validation
        timeoutInMinutes: 60
        inputs:
          notifyUsers: $(notifyUsers) # value set via the Azure Pipelines UI
          approvers: $(approvers) # value set via the Azure Pipelines UI
          allowApproversToApproveTheirOwnRuns: true
          instructions: "Please check the Terraform Plan for this branch on the merged commit's PR pipeline"
          onTimeout: "reject"

  - template: templates/terragrunt_job.yml
    parameters:
      environment: prod
      module: applications
      subscription: "Azure Pipeline: CMRC - Prod" #service principal
      runApply: true
      variableGroupName: 'cmrc-infra-vars-prod'
      dependsOnJob: Manual_Validation

  - template: templates/terragrunt_job.yml
    parameters:
      environment: prod
      module: base
      subscription: "Azure Pipeline: CMRC - Prod" #service principal
      runApply: true
      dependsOnJob: Manual_Validation
